# source.json に登録したリポジトリの GitHub Releases から index.json を生成し、
# GitHub Pages へデプロイする。
# 新しいリリースは 6 時間ごとのスケジュール実行または手動実行(workflow_dispatch)で反映される。
# 事前設定: リポジトリの Settings > Pages > Source を "GitHub Actions" にすること。
name: Build listing

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build index.json
        run: python3 scripts/build_listing.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6
        with:
          # 初回実行時に Pages(GitHub Actions ソース)を自動で有効化する
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      # アップロード直後の成果物が一覧 API にまだ現れず、deploy-pages が
      # "No artifacts named github-pages were found" で落ちることがある。
      # 1 回目の失敗は許容し、少し待ってから 1 度だけ再試行する。
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
